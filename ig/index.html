<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Amazon golf deals &middot; Golf, nothing more</title>
<script>
(function(){
  var m = (location.search.match(/[?&]s=([A-Za-z0-9_-]{1,24})/) || [])[1] || 'bio';
  location.replace('/deals/?utm_source=instagram&utm_medium=' + encodeURIComponent(m));
})();
</script>
<meta http-equiv="refresh" content="2;url=/deals/?utm_source=instagram&amp;utm_medium=bio">
<style>
:root{--bg:#EDEFEA;--fg:#101A15;--dim:#5C6A61;--mark:#14512F;--paper:#F2EAD5;
--display:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0E1511;--fg:#E6EDE6;--dim:#97A69C;--mark:#2F6B48;color-scheme:dark}}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--display);margin:0;
display:flex;min-height:100svh;align-items:center;justify-content:center;padding:24px;text-align:center}
.eyebrow{font-size:.68rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin:0}
h1{font-size:1.35rem;font-weight:700;margin:.6rem 0 0;letter-spacing:-.01em}
p.sub{color:var(--dim);font-size:.95rem;margin:.5rem 0 0}
a#go{display:block;width:100%;max-width:22rem;margin:1.6rem auto 0;box-sizing:border-box;
background:var(--mark);color:var(--paper);text-decoration:none;text-align:center;
padding:1.25rem 1.5rem;border-radius:999px;font-weight:700;font-size:1.35rem;line-height:1.2}
</style>
</head>
<body>
<div>
  <p class="eyebrow">Golf, nothing more</p>
  <h1>Taking you to the deals</h1>
  <p class="sub">If nothing happens in a second, use the button.</p>
  <a id="go" href="/deals/?utm_source=instagram&amp;utm_medium=bio">Open the deals</a>
</div>
</body>
</html>
