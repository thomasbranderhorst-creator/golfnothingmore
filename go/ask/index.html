<style>body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,sans-serif;background:#EDEFEA;color:#101A15;margin:0;display:grid;place-items:center;min-height:100vh;padding:2rem;text-align:center}
a{color:#14512F}p{max-width:26rem;line-height:1.6}
a#go{display:block;width:100%;max-width:22rem;margin:1.6rem auto 0;box-sizing:border-box;
background:#14512F;color:#F2EAD5;text-decoration:none;text-align:center;
padding:1.25rem 1.5rem;border-radius:999px;font-weight:700;font-size:1.35rem;line-height:1.2}

<script>
  window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
  plausible.init()
</script>
</head>
<body>
<p>Opening WhatsApp so you can ask Hanan at FanTrip&hellip;<a id="go" href="https://wa.me/972546375555">Open it now</a></p>
<p class="fine">No WhatsApp? <a id="fb" href="https://m.me/hanan.hefter">Message him on Facebook instead</a></p>
<script>
(function(){
  var PHONE = "972546375555";
  var BRAND = "fantrip";
  // Slug to tournament name. An unknown slug just gets the generic message,
  // so nothing a visitor types can end up in the text.
  var NAMES = {
    "abu-dhabi":"the Abu Dhabi Championship in November 2026",
    "dp-world-tour-championship":"the DP World Tour Championship in Dubai, November 2026",
    "australian-pga":"the BMW Australian PGA in Sydney, November 2026",
    "australian-open":"the Australian Open in Melbourne, December 2026",
    "nedbank":"the Nedbank Golf Challenge at Sun City, December 2026",
    "mauritius-open":"the AfrAsia Bank Mauritius Open, December 2026",
    "dubai-desert-classic":"the Hero Dubai Desert Classic in January 2027",
    "bahrain":"the Bahrain Championship in January 2027",
    "qatar-masters":"the Qatar Masters in February 2027",
    "kenya-open":"the Magical Kenya Open in February 2027",
    "alfred-dunhill":"the Alfred Dunhill Championship in Durban, February 2027",
    "sa-open":"the South African Open in March 2027",
    "joburg-open":"the Joburg Open in March 2027",
    "liv-adelaide":"LIV Golf Adelaide in March 2027",
    "scottish-open":"the Genesis Scottish Open in July 2027"
  };
  function param(name, re){
    try { var m = location.search.match(new RegExp('[?&]' + name + '=([^&]{1,40})'));
          if (m) { var v = decodeURIComponent(m[1]); return re.test(v) ? v : ''; } } catch (e) {}
    return '';
  }
  var trip = param('trip', /^[a-z0-9-]{1,40}$/);
  var src  = param('src', /^[a-z0-9_-]{1,32}$/) || 'direct';
  var what = Object.prototype.hasOwnProperty.call(NAMES, trip) ? NAMES[trip] : '';
  var msg = what
    ? "Hi Hanan, I saw " + what + " on Golf, nothing more. Can you tell me what tickets cost and what is possible for a group?"
    : "Hi Hanan, I came from Golf, nothing more. Can you tell me what is possible for a group going to a tournament?";
  var URL_ = "https://wa.me/" + PHONE + "?text=" + encodeURIComponent(msg);

  var btn = document.getElementById('go');
  if (btn) btn.setAttribute('href', URL_);

  var went = false;
  function go(){ if (went) return; went = true; location.replace(URL_); }
  setTimeout(go, 400);
  try {
    plausible('Go', { props: { brand: BRAND, page: 'ask', src: src, trip: trip || 'unknown' }, callback: go });
  } catch (e) { go(); }

  var sent = {};
  function flag(step){
    if (sent[step]) return; sent[step] = true;
    try { plausible('Go fallback', { props: { brand: BRAND, src: src, step: step } }); } catch (e) {}
  }
  var left = false;
  function away(){ left = true; }
  document.addEventListener('visibilitychange', function(){ if (document.hidden) away(); });
  window.addEventListener('pagehide', away);
  setTimeout(function(){ if (!left && document.visibilityState !== 'hidden') flag('stuck'); }, 2500);
  if (btn) {
    btn.addEventListener('pointerdown', function(){ flag('tap'); });
    btn.addEventListener('click', function(){ flag('tap'); });
  }
  var fb = document.getElementById('fb');
  if (fb) fb.addEventListener('click', function(){
    try { plausible('Go', { props: { brand: BRAND, page: 'ask', src: src, trip: trip || 'unknown', via: 'messenger' } }); } catch (e) {}
  });
})();
</script>
</body>
</html>
