<script>
(function(){
  var URL_ = "https://www.eatdrinksleepgolf.com";
  var BRAND = "eatdrinksleepgolf";
  var src = "direct";
  try {
    var m = location.search.match(/[?&]src=([A-Za-z0-9_-]{1,32})/);
    if (m) src = m[1].toLowerCase();
  } catch (e) {}
  var went = false;
  function go(){ if (went) return; went = true; location.replace(URL_); }
  setTimeout(go, 250);
  try {
    plausible('Go', { props: { brand: BRAND, page: 'go', src: src }, callback: go });
  } catch (e) { go(); }
})();
